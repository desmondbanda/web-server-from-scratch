<!doctype html>
<!-- The doctype tells the browser to use modern HTML. -->
<html lang="en">
<head>
    <!-- UTF-8 supports accented letters and other non-ASCII characters. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello from Rust</title>
</head>
<body>
    <!-- main contains the page's main content; h1 is its primary heading. -->
    <main>
        <h1>Hello from Rust!</h1>
        <p>Your browser requested this page, and your Rust server sent it back.</p>
        <!-- Clicking this link sends a new GET request to our /about route. -->
        <a href="/about">How this server works</a>
    </main>
</body>
</html>
